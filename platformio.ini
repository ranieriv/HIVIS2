; HIVIS Monitor 2.0 — PlatformIO project configuration

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

lib_compat_mode = strict
lib_ignore = WiFiNINA, WiFiNINA_-_Adafruit_Fork

lib_deps =
    boschsensortec/bsec2 @ ^1.10.2610
    boschsensortec/BME68x Sensor Library @ ^1.2.40408
    olikraus/U8g2 @ ^2.35.19
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8.0
    tzapu/WiFiManager @ ^2.0.17

build_flags =
    -L .pio/libdeps/esp32doit-devkit-v1/bsec2/src/esp32
    -lalgobsec
    -DFIRMWARE_VERSION='"2.0.2"'
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    -D CORE_DEBUG_LEVEL=0  ; suppress framework log_e/log_w noise (vfs_api etc.)
