# ─────────────────────────────────────────────────────
#  BOOTSTRAP CONFIG  (Step 1: get the SSL certificate)
#
#  Use this config when starting Nginx for the first time
#  so certbot can complete the ACME webroot challenge.
#
#  After the cert is issued, replace with hivis.conf and
#  run:  docker compose exec nginx nginx -s reload
# ─────────────────────────────────────────────────────

server {
    listen 80;
    server_name hvht.net www.hvht.net;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Temporary holding page while cert is being issued
    location / {
        default_type text/html;
        return 200 '<html><body style="font-family:sans-serif;text-align:center;padding:60px">
                    <h2>HIVIS Monitor</h2><p>Setting up SSL&hellip; check back shortly.</p></body></html>';
    }
}
