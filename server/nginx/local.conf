# Local testing config — HTTP only, proxies InfluxDB to X200 (172.16.1.156:8086)
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy InfluxDB API to the X200 server on the local network
    location = /api/v2/query {
        proxy_pass         http://172.16.1.156:8086/api/v2/query;
        proxy_http_version 1.1;
        proxy_set_header   Connection  "";
        proxy_set_header   Host        172.16.1.156;
        proxy_read_timeout 30s;
        proxy_buffering    off;
    }
}
