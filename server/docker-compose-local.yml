version: "3.8"
# Local development / testing only.
# Serves the HIVIS website on http://localhost:8080
# Proxies /api/v2/query to InfluxDB on the X200 (172.16.1.156:8086)
services:
  nginx-local:
    image: nginx:alpine
    container_name: hivis-local
    ports:
      - "8080:80"
    volumes:
      - ./website:/usr/share/nginx/html:ro
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
